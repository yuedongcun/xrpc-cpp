global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: xrpc
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:19100"
          - "host.docker.internal:19101"
          - "host.docker.internal:19102"
