name: xrpc-observability

services:
  consul:
    image: hashicorp/consul:1.22.7
    container_name: xrpc-consul
    command:
      - agent
      - -dev
      - -client=0.0.0.0
      - -ui
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 2s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.4
    container_name: xrpc-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      consul:
        condition: service_healthy

volumes:
  prometheus-data:
