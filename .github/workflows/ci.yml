name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-install:
    name: Build, Test, and Install
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            cmake \
            python3

      - name: Build
        run: make

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure -LE "external|tooling"

      - name: Validate tools
        run: ctest --test-dir build/tests --output-on-failure -L tooling

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/xrpc-install"

      - name: Install package-consumer dependencies
        run: |
          sudo apt-get install --no-install-recommends \
            libprotobuf-dev \
            liburing-dev \
            nlohmann-json3-dev

      - name: Validate installed package
        run: |
          cmake -S tests/package_consumer -B build/package-consumer -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/xrpc-install"
          make -C build/package-consumer
