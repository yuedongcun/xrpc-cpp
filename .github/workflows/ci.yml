name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-install:
    name: 构建、测试与安装验证
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            cmake \
            libgtest-dev \
            libprotobuf-dev \
            liburing-dev \
            ninja-build \
            nlohmann-json3-dev \
            protobuf-compiler \
            python3

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXRPC_BUILD_EXAMPLES=ON \
            -DXRPC_BUILD_TESTS=ON \
            -DXRPC_BUILD_TOOLS=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 测试
        run: ctest --test-dir build/tests --output-on-failure -LE "external|tooling"

      - name: 验证工具
        run: ctest --test-dir build/tests --output-on-failure -L tooling

      - name: 安装
        run: cmake --install build --prefix "${{ runner.temp }}/xrpc-install"

      - name: 验证安装后的软件包
        run: |
          cmake -S tests/package_consumer -B build/package-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/xrpc-install"
          cmake --build build/package-consumer
